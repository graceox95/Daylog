<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Daylog</title>
        <style>
            @import url('https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding.css');
            body{
                margin: 0px;
                background-color: #121214;
                font-family: 'D2Coding', 'D2 coding', Monaco, monospace;
                color: #e0e0e0;
                font-size: 16px;
                letter-spacing: -0.02em;
            }
            p{
                color: #e0e0e0;
                margin: 0px;
            }
            a:link, a:visited{
                color: #e0e0e0;
                text-decoration: none;
            }
            .sideBarMenu{
                display: flex; flex-direction: column;
                position: fixed;
                background-color: #1e1e22;
                width: 200px; height: 100%;
            }
            .content{
                margin-left: 200px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
                box-sizing: border-box;
            }
            .logo{
                margin-top: 20px; margin-left: 20px;
                font-size: 35px; font-weight: 600;
            }
            .menuNav{
                display: flex; flex-direction: column;
                margin-left: 20px; margin-top: 16px;
                row-gap: 5px;
                font-size: 20px;
            }
            .entryList{
                width: 1100px; max-width: 100%;
                margin-top: 20px;
                display: flex; flex-direction: column;
                row-gap: 8px;
            }
            .entryItem{
                background-color: #1e1e22;
                border: 1px solid #3a3a3f; border-radius: 10px;
                padding: 10px 14px;
            }
            .entryItem .entryTitle{
                color: #F472B6; font-weight: 600;
            }
            .entryItem .entryDate{
                font-size: 13px; color: #9a9a9f;
            }
        </style>
    </head>
    <body>
        <div class="sideBarMenu">
            <div class="logo"><a href="/home">Day<span id="logo" style="color: #F472B6">log</span></div>
            <div class="menuNav">
                <a class="signInButton" href="/signIn">Sign in/Sign up</p>
                <a href="/home">Home</a>
                <a href="/diary">Diary</a>
                <a href="/Record">Record</a>
            </div>
        </div>
        <div class="content">
            <div class="entryList" id="entryList"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
